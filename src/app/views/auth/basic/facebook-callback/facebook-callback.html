<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow" style="min-width: 400px; max-width: 600px;">
        <div class="card-body text-center p-4">
            <div class="mb-3">
                <i class="fab fa-facebook fa-3x" style="color: #1877F2;"></i>
            </div>

            @if (processing) {
                <h5 class="mb-3">Facebook Hesabı Bağlanıyor...</h5>
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-3">Lütfen bekleyin, veriler işleniyor.</p>
            }

            @if (success) {
                <h5 class="text-success mb-3">
                    <i class="fa-solid fa-circle-check me-1"></i> Bağlantı Başarılı
                </h5>
                <p class="text-muted">Facebook hesabınız başarıyla bağlandı. Bu pencere kapanacak...</p>
            }

            @if (errorMessage) {
                <h5 class="text-danger mb-3">
                    <i class="fa-solid fa-circle-xmark me-1"></i> Hata
                </h5>
                <p class="text-muted">{{ errorMessage }}</p>
                <a class="btn btn-primary btn-sm mt-2" routerLink="/admin/social-media/accounts">Geri Dön</a>
            }
        </div>
    </div>
</div>
