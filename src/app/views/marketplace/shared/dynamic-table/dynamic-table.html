<div class="table-responsive">
    <table class="table table-centered table-hover mb-0">
        <thead class="table-light">
            <tr>
                <th>İşlemler</th>
                @for (column of columns; track column) {
                    <th>{{ label(column) }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for (row of rows; track $index) {
                <tr>
                    <td class="text-nowrap">
                        <button class="btn btn-soft-primary btn-sm" (click)="openDetail(row)" title="Detay">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </td>
                    @for (column of columns; track column) {
                        <td class="dynamic-cell">{{ format(row[column]) }}</td>
                    }
                </tr>
            } @empty {
                <tr>
                    <td [attr.colspan]="columns.length + 1" class="text-center text-muted py-4">{{ emptyText }}</td>
                </tr>
            }
        </tbody>
    </table>
</div>

@if (showModal && selectedRow) {
    <div class="modal fade show d-block modal-backdrop-layer" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-file-lines me-2"></i>Kayıt Detayı</h5>
                    <button type="button" class="btn-close" (click)="closeModal()"></button>
                </div>
                <div class="modal-body">
                    <pre class="json-block mb-0">{{ selectedJson }}</pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" (click)="closeModal()">Kapat</button>
                </div>
            </div>
        </div>
    </div>
}
