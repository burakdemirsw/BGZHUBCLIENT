<aside
    class="sidebar"
    [class.collapsed]="collapsed"
    [class.mobile-open]="mobileOpen">

    <!-- HEADER -->
    <header class="sidebar-header">
        <button
            type="button"
            class="icon-btn left-reload"
            (click)="onReloadClick()"
            title="Sohbetleri yenile">
            <span [innerHTML]="safeRefreshIcon"></span>
        </button>

        <div class="header-actions" *ngIf="!collapsed">
            <button
                type="button"
                class="icon-btn"
                (click)="onCollapseClick()"
                title="Sidebar'ı gizle">
                <span [innerHTML]="safeSidebarIcon"></span>
            </button>
        </div>
    </header>

    <!-- Collapsed: floating expand button just below header -->
    <button
        *ngIf="collapsed"
        type="button"
        class="collapsed-toggle"
        (click)="onCollapseClick()"
        title="Sidebar'ı aç">
        <span [innerHTML]="safeSidebarIcon"></span>
    </button>

    <!-- SCROLLABLE BODY -->
    <div class="sidebar-body" (scroll)="onBodyScroll($event)">
        <!-- MAIN NAV -->
        <nav class="main-nav">
            @for (item of mainNav; track item.id) {
                <nac-nav-item
                    [label]="item.label"
                    [iconSvg]="item.iconSvg"
                    [badge]="item.badge"
                    [collapsed]="collapsed"
                    (click)="onNavClick(item)">
                </nac-nav-item>
            }
        </nav>

        <!-- CHAT HISTORY -->
        <nac-sidebar-section title="Sohbetler" [collapsed]="collapsed">
            @for (chat of chats; track chat.id) {
                <button
                    type="button"
                    class="chat-item"
                    [class.active]="activeChatId === chat.id"
                    [attr.title]="collapsed ? chat.label : null"
                    (click)="onChatSelect(chat)">
                    <span class="chat-dot" *ngIf="collapsed"></span>
                    <div class="chat-meta" *ngIf="!collapsed">
                        <div class="chat-meta-head">
                            <span class="chat-label">{{ chat.label }}</span>
                            <span class="chat-date" *ngIf="chat.dateText">{{ chat.dateText }}</span>
                        </div>
                        <span class="chat-preview" *ngIf="chat.preview">{{ chat.preview }}</span>
                    </div>
                </button>
            }

            @if (!collapsed && isLoadingMoreChats) {
                <div class="chat-loading" aria-live="polite" aria-label="Sohbetler yükleniyor">
                    <span class="chat-loading-dot"></span>
                    <span class="chat-loading-dot"></span>
                    <span class="chat-loading-dot"></span>
                    <span class="chat-loading-text">Yükleniyor...</span>
                </div>
            }
        </nac-sidebar-section>
    </div>

    <!-- USER -->
    <nac-user-profile [collapsed]="collapsed"></nac-user-profile>
</aside>

<!-- MOBILE OVERLAY -->
<div class="mobile-overlay" *ngIf="mobileOpen" (click)="onCloseMobile()"></div>
