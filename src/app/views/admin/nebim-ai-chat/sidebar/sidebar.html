<aside
    class="sidebar"
    [class.collapsed]="collapsed"
    [class.mobile-open]="mobileOpen"
    aria-label="Sohbet menüsü">

    <header class="sidebar-header">
        <button
            type="button"
            class="icon-btn"
            (click)="reloadChats.emit()"
            title="Sohbetleri yenile"
            aria-label="Sohbetleri yenile">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                <path d="M21 3v6h-6"/>
            </svg>
        </button>

        <button
            type="button"
            class="icon-btn"
            (click)="toggleCollapse.emit()"
            [title]="collapsed ? 'Menüyü genişlet' : 'Menüyü daralt'"
            [attr.aria-label]="collapsed ? 'Menüyü genişlet' : 'Menüyü daralt'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M9 4v16"/>
            </svg>
        </button>
    </header>

    <div class="sidebar-body" (scroll)="onBodyScroll($event)">
        <nav class="main-nav">
            @for (item of mainNav; track item.id) {
                <nac-nav-item
                    [label]="item.label"
                    [icon]="item.icon"
                    [collapsed]="collapsed"
                    (click)="onNavClick(item)" />
            }
        </nav>

        <nac-sidebar-section title="Sohbetler" [collapsed]="collapsed">
            @for (chat of chats; track chat.id; let i = $index) {
                <button
                    type="button"
                    class="chat-item"
                    [class.active]="activeChatId === chat.id"
                    [attr.aria-current]="activeChatId === chat.id ? 'page' : null"
                    [attr.title]="collapsed ? chat.label : null"
                    [style.--i]="i"
                    (click)="selectChat.emit(chat.id)">
                    @if (collapsed) {
                        <span class="chat-dot"></span>
                    } @else {
                        <span class="chat-meta">
                            <span class="chat-meta-head">
                                <span class="chat-label">{{ chat.label }}</span>
                                @if (chat.dateText) {
                                    <span class="chat-date">{{ chat.dateText }}</span>
                                }
                            </span>
                            @if (chat.preview && chat.preview !== chat.label) {
                                <span class="chat-preview">{{ chat.preview }}</span>
                            }
                        </span>
                    }
                </button>
            } @empty {
                @if (!collapsed) {
                    <p class="chat-empty">Henüz sohbet yok.</p>
                }
            }

            <!-- Liste kaydirilamayacak kadar kisaysa scroll ile yukleme tetiklenmez -->
            @if (!collapsed && hasMoreChats && !isLoadingMoreChats) {
                <button type="button" class="chat-more" (click)="loadMoreChats.emit()">Daha fazla göster</button>
            }

            @if (!collapsed && isLoadingMoreChats) {
                <div class="chat-loading" aria-live="polite">
                    <span class="chat-loading-dot"></span>
                    <span class="chat-loading-dot"></span>
                    <span class="chat-loading-dot"></span>
                    <span class="chat-loading-text">Yükleniyor...</span>
                </div>
            }
        </nac-sidebar-section>
    </div>

    <nac-user-profile [collapsed]="collapsed" />
</aside>

@if (mobileOpen) {
    <div class="mobile-overlay" (click)="closeMobile.emit()"></div>
}
