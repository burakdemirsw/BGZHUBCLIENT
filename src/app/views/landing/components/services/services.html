<section class="section-custom" id="services">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center mb-5">
                <span class="section-label">Platform Özellikleri</span>
                <h2 class="section-heading">
                    İletişim Süreçlerinizi <span class="gradient-text">Tek Noktadan</span> Yönetin
                </h2>
                <p class="section-subtext">
                    Birden fazla kanal, birden fazla araç yerine — hepsini bir arada sunan tek platform
                </p>
            </div>
        </div>

        <div class="row g-4">
            @for (service of services; track $index) {
                <div class="col-lg-4 col-md-6">
                    <div class="feature-card h-100">
                        <div class="feature-icon">
                            <ng-icon [name]="service.icon" />
                        </div>
                        <h4>{{service.name}}</h4>
                        <p>{{service.description}}</p>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
