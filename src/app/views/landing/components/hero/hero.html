<section class="bg-light bg-opacity-50 border-top border-light position-relative" id="home">

    <div class="container pt-5 position-relative">

        <div class="row">
            <div class="col-lg-8 mx-auto text-center">


                <h1 class="my-4 fs-36 fw-bold lh-base">
                    Yapay Zeka Destekli <span class="text-primary">Müşteri İletişim</span> Platformu —
                    <span class="text-muted">Tüm Kanallar, Tek Panel</span>
                </h1>


                <p class="mb-4 fs-md text-muted lh-lg">
                    SellenticAI ile müşterilerinize WhatsApp, SMS, e-posta ve web chat üzerinden anında ulaşın.
                    AI chatbot, otomasyon ve gerçek zamanlı analitik ile müşteri deneyimini bir üst seviyeye taşıyın.
                </p>


                <div class="d-flex gap-1 gap-sm-2 flex-wrap justify-content-center">
                    <a class="btn btn-primary py-2 fw-semibold" routerLink="/auth/sign-up">
                        <ng-icon name="tablerRocket" class="fs-xl me-2"></ng-icon>Ücretsiz Başla
                    </a>
                    <a class="btn btn-outline-secondary py-2 fw-semibold" (click)="scrollToSection('features')" href="javascript:void(0)">
                        <ng-icon name="tablerPlayerPlay" class="fs-xl me-2"></ng-icon>Nasıl Çalışır?
                    </a>
                </div>
            </div>
        </div>


        <div class="container position-relative">

            <div class="row">
                <div class="col-md-10 mx-auto position-relative">


                    <img src="assets/images/dashboard.png" class="rounded-top-4 img-fluid mt-5" alt="SellenticAI Dashboard">

                </div>
            </div>
        </div>
    </div>
</section>
