<div class="container-fluid mt-3">

    <div class="row g-3 row-cols-1 row-cols-md-2 row-cols-xxl-4 mb-4">
        @for (metric of metrics; track $index) {
            <div class="col">
                <app-statistic-card [item]="metric"/>
            </div>
        }
    </div>


    <div class="row">
        <div class="col-12">
            <app-sales-charts/>
        </div>
    </div>

    <div class="row">
        <div class="col-xxl-6">
            <app-product-inventory/>
        </div>

        <div class="col-xxl-6">
            <app-recent-orders/>
        </div>
    </div>

</div>
