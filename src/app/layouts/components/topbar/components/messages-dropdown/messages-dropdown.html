<div class="topbar-item">
    <div ngbDropdown class="d-inline-block" placement="bottom-end">
        <button ngbDropdownToggle class="topbar-link dropdown-toggle drop-arrow-none">
            <lucide-angular [img]="LucideBell" class="fs-xxl" />
            @if (unreadCount > 0) {
                <span class="badge text-bg-danger badge-circle topbar-badge">{{ unreadCount }}</span>
            }
        </button>

        <div ngbDropdownMenu class="p-0 dropdown-menu-end dropdown-menu-lg">
            <div class="px-3 py-2 border-bottom">
                <div class="row align-items-center">
                    <div class="col">
                        <h6 class="m-0 fs-md fw-semibold">Bildirimler</h6>
                    </div>
                    <div class="col text-end">
                        @if (unreadCount > 0) {
                            <a href="javascript:void(0)" (click)="markAllAsRead()"
                               class="badge badge-soft-success badge-label py-1">
                                Tümünü Okundu İşaretle
                            </a>
                        } @else if (notifications.length > 0) {
                            <span class="badge badge-soft-secondary badge-label py-1">Tümü Okundu</span>
                        } @else {
                            <span class="badge badge-soft-secondary badge-label py-1">Bildirim Yok</span>
                        }
                    </div>
                </div>
            </div>

            <ngx-simplebar style="max-height: 300px; overflow-y: auto;">
                @if (notifications.length === 0) {
                    <div class="text-center py-4 text-muted">
                        <i class="fa-regular fa-bell-slash fs-1 mb-2 d-block opacity-50"></i>
                        <span class="fs-sm">Henüz bildiriminiz yok</span>
                    </div>
                }

                @for (item of notifications; track item.id) {
                    <button
                        ngbDropdownItem
                        class="notification-item py-2 text-wrap"
                        [ngClass]="{ 'active': !item.isRead }"
                        (click)="markAsRead(item)">

                        <span class="d-flex gap-3 align-items-center">
                            <span class="avatar-md flex-shrink-0 position-relative">
                                <span class="avatar-title rounded-circle fs-22"
                                      [ngClass]="item.isRead ? 'bg-light' : 'bg-soft-primary'">
                                    <i [class]="getNotificationIcon(item) + ' fs-5'"
                                       [ngClass]="'text-' + getNotificationVariant(item)"></i>
                                </span>
                            </span>

                            <span class="flex-grow-1 text-muted">
                                <span class="fw-medium text-body d-block">
                                    {{ getTitle(item) }}
                                </span>
                                <span class="fs-xs d-block text-truncate" style="max-width: 220px;">
                                    {{ getMessage(item) }}
                                </span>
                                <span class="fs-xs opacity-75">
                                    {{ getTimeAgo(item.sentDate || item.createdDate) }}
                                </span>
                            </span>

                            @if (!item.isRead) {
                                <span class="flex-shrink-0">
                                    <span class="badge bg-primary rounded-pill" style="width: 8px; height: 8px;">&nbsp;</span>
                                </span>
                            }
                        </span>
                    </button>
                }
            </ngx-simplebar>
        </div>
    </div>
</div>
