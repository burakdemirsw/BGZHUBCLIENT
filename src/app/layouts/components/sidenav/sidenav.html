<div class="sidenav-menu">

        <app-logo></app-logo>

    <!-- Sidebar Hover Menu Toggle Button -->
    <button (click)="hoverSidebar()" class="button-on-hover">
        <ng-icon name="tablerMenu4" size="22" class="align-middle"/>
    </button>

    <!-- Offcanvas Sidebar Menu Close Button -->
    <button (click)="closeSidebar()" class="button-close-offcanvas">
        <ng-icon name="tablerX" class="align-middle"/>
    </button>

    <!-- Sidebar Search -->
    <div class="sidenav-search">
        <div class="sidenav-search-box">
            <i class="fa-solid fa-magnifying-glass sidenav-search-icon"></i>
            <input type="text" class="sidenav-search-input" placeholder="Ara..." [(ngModel)]="searchQuery">
            @if (searchQuery) {
                <button class="sidenav-search-clear" (click)="searchQuery = ''">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            }
        </div>
    </div>

    <ngx-simplebar id="sidenav" class="scrollbar sidenav-scrollbar">
        <!--- Sidenav Menu -->
        <app-menu [searchQuery]="searchQuery"/>
    </ngx-simplebar>

    <!-- User Profile (fixed at bottom) -->
    <app-user-profile/>
</div>
