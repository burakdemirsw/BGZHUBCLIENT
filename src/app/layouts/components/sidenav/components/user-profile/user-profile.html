<div class="sidenav-user-bottom">
    <div class="d-flex align-items-center">
        <div class="rounded-circle d-flex align-items-center justify-content-center bg-primary text-white fw-bold flex-shrink-0"
             style="width: 40px; height: 40px; font-size: 15px;">
            {{ authState.initials || '?' }}
        </div>
        <div class="ms-3 overflow-hidden">
            <div class="fw-semibold text-truncate" style="font-size: 14px;">{{ authState.fullName || 'Kullanıcı' }}</div>
            <div class="text-muted text-truncate" style="font-size: 12px;">{{ authState.profile?.lastLoginDate ? 'admin' : 'kullanıcı' }}</div>
        </div>
        <div class="ms-auto" ngbDropdown [placement]="'top-end'">
            <button ngbDropdownToggle
                    class="btn btn-link p-0 dropdown-toggle drop-arrow-none link-reset text-muted">
                <ng-icon name="tablerDotsVertical" size="20" class="align-middle"/>
            </button>
            <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end mb-1">
                @for (item of menuItems; track $index) {
                    <div>
                        @if (item.isHeader) {
                            <div class="dropdown-header noti-title">
                                <h6 class="text-overflow m-0">{{ item.label }}</h6>
                            </div>
                        }
                        @if (item.isDivider) {
                            <div class="dropdown-divider"></div>
                        }
                        @if (!item.isHeader && !item.isDivider) {
                            <a [routerLink]="item.url" class="dropdown-item"
                               [class]="item.class"
                               (click)="onItemClick(item, $event)">
                                <ng-icon [name]="item.icon" size="17"
                                         class="align-middle d-inline-flex align-items-center me-2"/>
                                <span class="align-middle" [innerHTML]="item.label"></span>
                            </a>
                        }
                    </div>
                }
            </div>
        </div>
    </div>
</div>
