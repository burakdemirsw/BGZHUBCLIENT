@if (visible) {
<div class="splash-overlay" [class.fade-out]="fadingOut">
  <div class="splash-content">
    <!-- Animated greeting icon -->
    <div class="splash-icon">
      <span class="wave-emoji">👋</span>
    </div>

    <!-- Welcome text -->
    <h1 class="splash-greeting">Hoş Geldiniz</h1>

    <!-- User name -->
    <h2 class="splash-name">{{ fullName }}</h2>

    <!-- Divider -->
    <div class="splash-divider"></div>

    <!-- Last login -->
    @if (lastLoginFormatted) {
    <p class="splash-last-login">
      <i class="fa-regular fa-clock"></i>
      Son giriş: <strong>{{ lastLoginFormatted }}</strong>
    </p>
    }

    <!-- Subtle loading dots -->
    <div class="splash-loader">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <!-- Background particles -->
  <div class="particles">
    @for (p of particles; track p) {
    <div class="particle" [style.left.%]="p.x" [style.animation-delay.s]="p.delay" [style.animation-duration.s]="p.duration"></div>
    }
  </div>
</div>
}
