components:
  schemas:
    AddConversationsToListRequest:
      required:
        - listId
        - conversationIds
      type: object
      properties:
        listId:
          type: string
          format: uuid
        conversationIds:
          type:
            - "null"
            - array
          items:
            type: string
            format: uuid
    AddConversationsToSegmentRequest:
      required:
        - segmentId
        - companyId
        - conversationIds
      type: object
      properties:
        segmentId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        conversationIds:
          type:
            - "null"
            - array
          items:
            type: string
            format: uuid
    AddConversationToListRequest:
      required:
        - conversationId
        - listId
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        listId:
          type: string
          format: uuid
    AddConversationToSegmentRequest:
      required:
        - conversationId
        - segmentId
        - companyId
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        segmentId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
    AiAssistantResponse:
      required:
        - id
        - userId
        - companyId
        - name
        - order
        - aiProviderId
        - aiModelId
        - isBlocked
        - createdDate
        - updatedDate
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type:
            - "null"
            - string
        order:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        aiProviderId:
          type: string
          format: uuid
        aiModelId:
          type: string
          format: uuid
        isBlocked:
          type: boolean
        createdDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time
    AiChatContentBlock:
      required:
        - type
      type: object
      properties:
        type:
          type:
            - "null"
            - string
        title:
          type:
            - "null"
            - string
        order:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
          default: 0
        text:
          type:
            - "null"
            - string
        table:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AiChatTableData"
        images:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/AiChatImageData"
    AiChatImageData:
      required:
        - url
      type: object
      properties:
        url:
          type:
            - "null"
            - string
        caption:
          type:
            - "null"
            - string
        alt:
          type:
            - "null"
            - string
    AiChatRequest:
      required:
        - conversationId
        - companyId
        - message
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        message:
          type:
            - "null"
            - string
        userId:
          type:
            - "null"
            - string
          format: uuid
        assistantId:
          type:
            - "null"
            - string
          format: uuid
        file:
          type:
            - "null"
            - string
        fileType:
          type:
            - "null"
            - string
    AiChatResponse:
      required:
        - success
        - response
        - error
        - model
        - inputTokens
        - outputTokens
        - totalTokens
        - costUsd
      type: object
      properties:
        success:
          type: boolean
        response:
          type:
            - "null"
            - string
        error:
          type:
            - "null"
            - string
        model:
          type:
            - "null"
            - string
        inputTokens:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        outputTokens:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        totalTokens:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int32
        costUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - "null"
            - number
            - string
          format: double
        userMessageId:
          type:
            - "null"
            - string
          format: uuid
        assistantMessageId:
          type:
            - "null"
            - string
          format: uuid
        aiMessageId:
          type:
            - "null"
            - string
          format: uuid
        responseType:
          type:
            - "null"
            - string
          default: text
        blocks:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/AiChatContentBlock"
        toolPayloads:
          type:
            - "null"
            - array
          items:
            $ref: "#/components/schemas/AiChatToolPayload"
        hasImage:
          type: boolean
